<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>
	<title>Pseudo-Elements</title>
	<style>
		#container{
			margin:20px;
			
		}
		#container::before{
			content: "Before Element";
			color: #f00;
			Font-size: 20px;
		}
		#container::After{
			content: "After Element";
			color: #f00;
			Font-size: 20px;
			
		}
	</style>

<body>
	<!-- the entire body must be written by student -->
	<div id="container">
		<p>This is the main container element</p>
	</div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
